<template id="student-dashboard">
  <header class="student-hero">
    <p class="eyebrow" data-role></p>
    <h2 data-greeting></h2>
    <p class="help" data-intro></p>
  </header>
  <section class="student-empty" data-empty hidden>
    <div class="student-empty-mark" aria-hidden="true">+</div>
    <div>
      <h3 data-empty-title></h3>
      <p class="help" data-empty-copy></p>
    </div>
  </section>
  <section class="sec student-lessons" data-lesson-section hidden>
    <div class="student-section-head">
      <div>
        <p class="eyebrow" data-path-label></p>
        <h3 data-lessons-title></h3>
      </div>
      <span class="student-progress-total" data-progress-total></span>
    </div>
    <div class="student-class-list" data-classes></div>
  </section>
  <section class="sec" data-assignment-section hidden>
    <h3 data-assignments-title></h3>
    <ul class="alist" data-assignments></ul>
  </section>
  <form class="card joinform student-join" id="joinForm">
    <h4 data-join-title></h4>
    <p class="help" data-join-help></p>
    <div class="guess-row">
      <div class="field">
        <label for="j-code" data-code-label></label>
        <input id="j-code" autocomplete="off" autocapitalize="characters" spellcheck="false" dir="ltr" maxlength="12">
      </div>
      <button type="submit" class="btn" data-join-button></button>
    </div>
    <div id="joinMsg" aria-live="polite"></div>
  </form>
  <details class="fold student-scores">
    <summary data-scores-title></summary>
    <div data-score-table></div>
  </details>
</template>

<template id="student-class-track">
  <section class="student-class-track">
    <header class="student-class-head">
      <div>
        <p class="eyebrow" data-class-label></p>
        <h4 data-class-name></h4>
      </div>
      <span class="student-class-progress" data-class-progress></span>
    </header>
    <ol class="student-lesson-grid" data-lessons></ol>
  </section>
</template>

<template id="student-lesson-card">
  <li class="student-lesson-card" data-state>
    <div class="student-lesson-top">
      <span class="student-lesson-number" data-number></span>
      <span class="student-lesson-status" data-status></span>
    </div>
    <h5 data-title></h5>
    <p data-detail></p>
    <button type="button" class="btn" data-open></button>
  </li>
</template>
