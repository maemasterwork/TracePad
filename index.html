\n<td>Read + write<\/td>\n<td>Error<\/td>\n<td>Kept<\/td>\n<\/tr>\n<tr>\n<td><code>&quot;rb&quot;<\/code>, <code>&quot;wb&quot;<\/code><\/td>\n<td>Binary modes (images, PDFs)<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>Tip for Persian/Unicode text:<\/strong> always specify <code>encoding=&quot;utf-8&quot;<\/code>, otherwise the default may depend on the operating system and produce garbled or failing output.<\/p>\n<\/blockquote>\n<h3 id=\"s-9-3\">9.3 Reading<\/h3>\n<figure class=\"cb\" data-bid=\"c9-3\" data-lang=\"python\"><pre class=\"code\"><code>with open(\"notes.txt\", encoding=\"utf-8\") as f:\n    content = f.read()          # whole file as one string\nprint(content)\n\nwith open(\"notes.txt\", encoding=\"utf-8\") as f:\n    first_line = f.readline()   # one line (includes \"\\n\")\n    rest = f.readlines()        # remaining lines as a list\n\n# Best for big files: iterate line by line (memory efficient)\nwith open(\"notes.txt\", encoding=\"utf-8\") as f:\n    for number, line in enumerate(f, start=1):\n        print(number, line.rstrip(\"\\n\"))\n<\/code><\/pre><\/figure>\n<h3 id=\"s-9-4\">9.4 Writing and appending<\/h3>\n<figure class=\"cb\" data-bid=\"c9-4\" data-lang=\"python\"><pre class=\"code\"><code>lines = [\"apple\\n\", \"banana\\n\", \"cherry\\n\"]\nwith open(\"fruits.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.writelines(lines)\n\nwith open(\"fruits.txt\", \"a\", encoding=\"utf-8\") as f:\n    f.write(\"date\\n\")\n\n# print() can write to files too\nwith open(\"report.txt\", \"w\", encoding=\"utf-8\") as f:\n    print(\"Report title\", file=f)\n    print(f\"Total: {42:,}\", file=f)\n<\/code><\/pre><\/figure>\n<h3 id=\"s-9-5\">9.5 Handling errors<\/h3>\n<figure class=\"cb\" data-bid=\"c9-5\" data-lang=\"python\"><pre class=\"code\"><code>try:\n    with open(\"missing.txt\", encoding=\"utf-8\") as f:\n        data = f.read()\nexcept FileNotFoundError:\n    print(\"File not found - check the path.\")\nexcept PermissionError:\n    print(\"No permission to read this file.\")\nelse:\n    print(\"Read OK:\", len(data), \"characters\")\n<\/code><\/pre><\/figure>\n<h3 id=\"s-9-6\">9.6 Paths with <code>pathlib<\/code><\/h3>\n<figure class=\"cb\" data-bid=\"c9-6\" data-lang=\"python\"><pre class=\"code\"><code>from pathlib import Path\n\nfolder = Path(\"data\")\nfolder.mkdir(exist_ok=True)\n\nfile_path = folder / \"scores.txt\"       # `/` joins paths on any OS\nfile_path.write_text(\"Ali,17\\nSara,20\\n\", encoding=\"utf-8\")\n\nprint(file_path.exists())               # True\nprint(file_path.name, file_path.suffix) # scores.txt .txt\nprint(file_path.read_text(encoding=\"utf-8\"))\n\nfor p in folder.glob(\"*.txt\"):          # list files\n    print(p)\n<\/code><\/pre><\/figure>\n<h3 id=\"s-9-7\">9.7 CSV and JSON (structured data)<\/h3>\n<figure class=\"cb\" data-bid=\"c9-7\" data-lang=\"python\"><pre class=\"code\"><code>import csv, json\n\n# ---- CSV ----\nrows = [[\"name\", \"score\"], [\"Ali\", 17], [\"Sara\", 20]]\nwith open(\"scores.csv\", \"w\", newline=\"\", encoding=\"utf-8\") as f:\n    csv.writer(f).writerows(rows)\n\nwith open(\"scores.csv\", newline=\"\", encoding=\"utf-8\") as f:\n    for row in csv.DictReader(f):\n        print(row[\"name\"], row[\"score\"])    # values are strings!\n\n# ---- JSON ----\nprofile = {\"name\": \"Sara\", \"skills\": [\"Python\", \"SQL\"], \"active\": True}\nwith open(\"profile.json\", \"w\", encoding=\"utf-8\") as f:\n    json.dump(profile, f, indent=2, ensure_ascii=False)   # keeps Persian readable\n\nwith open(\"profile.json\", encoding=\"utf-8\") as f:\n    loaded = json.load(f)\nprint(loaded[\"skills\"])\n<\/code><\/pre><\/figure>\n<h3 id=\"s-9-8\">9.8 Practical examples<\/h3>\n<p><strong>Example 1 – Simple logger<\/strong><\/p>\n<figure class=\"cb\" data-bid=\"c9-8\" data-lang=\"python\"><pre class=\"code\"><code>from datetime import datetime\n\ndef log(message, filename=\"app.log\"):\n    stamp = datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n    with open(filename, \"a\", encoding=\"utf-8\") as f:\n        f.write(f\"[{stamp}] {message}\\n\")\n\nlog(\"Application started\")\nlog(\"User Ali logged in\")\n<\/code><\/pre><\/figure>\n<p><strong>Example 2 – Word counter for any text file<\/strong><\/p>\n<figure class=\"cb\" data-bid=\"c9-9\" data-lang=\"python\"><pre class=\"code\"><code>from collections import Counter\nfrom pathlib import Path\n\ndef top_words(path, n=5):\n    text = Path(path).read_text(encoding=\"utf-8\").lower()\n    words = [w.strip(\".,!?;:\\\"'()\") for w in text.split()]\n    return Counter(w for w in words if w).most_common(n)\n\nprint(top_words(\"notes.txt\"))\n<\/code><\/pre><\/figure>\n<p><strong>Example 3 – Persistent contact book (dictionary + JSON)<\/strong><\/p>\n<figure class=\"cb\" data-bid=\"c9-10\" data-lang=\"python\"><pre class=\"code\"><code>import json\nfrom pathlib import Path\n\nDB = Path(\"contacts.json\")\n\ndef load():\n    return json.loads(DB.read_text(encoding=\"utf-8\")) if DB.exists() else {}\n\ndef save(contacts):\n    DB.write_text(json.dumps(contacts, indent=2, ensure_ascii=False), encoding=\"utf-8\")\n\ncontacts = load()\ncontacts[\"sara\"] = \"0935-444-5566\"\ncontacts[\"علی\"] = \"0912-111-2233\"      # Unicode keys work fine\nsave(contacts)\nprint(load())\n<\/code><\/pre><\/figure>\n<p><strong>Example 4 – Grade report from a text file<\/strong><\/p>\n<figure class=\"cb\" data-bid=\"c9-11\" data-lang=\"python\"><pre class=\"code\"><code># grades.txt:  Ali,17,15,18  (one student per line)\nwith open(\"grades.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"Ali,17,15,18\\nSara,20,19,18\\nReza,12,14,10\\n\")\n\nwith open(\"grades.txt\", encoding=\"utf-8\") as src, \\\n     open(\"report.txt\", \"w\", encoding=\"utf-8\") as out:\n    for line in src:\n        name, *marks = line.strip().split(\",\")\n        marks = [float(m) for m in marks]\n        out.write(f\"{name:&lt;6} {sum(marks) / len(marks):6.2f}\\n\")\n\nprint(open(\"report.txt\", encoding=\"utf-8\").read())\n<\/code><\/pre><\/figure>\n<p><strong>Example 5 – Safe file copy with line numbers<\/strong><\/p>\n<figure class=\"cb\" data-bid=\"c9-12\" data-lang=\"python\"><pre class=\"code\"><code>def copy_with_numbers(src, dst):\n    with open(src, encoding=\"utf-8\") as fin, open(dst, \"w\", encoding=\"utf-8\") as fout:\n        for i, line in enumerate(fin, 1):\n            fout.write(f\"{i:03d}: {line}\")\n\ncopy_with_numbers(\"notes.txt\", \"notes_numbered.txt\")\n<\/code><\/pre><\/figure>\n<h3 id=\"s-9-9\">9.9 Try It<\/h3>\n<ol class=\"checklist\" data-cl=\"c9-l1\">\n<li data-i=\"0\">Create a file with 5 lines, read it back, and print only the lines containing the letter <code>a<\/code>.<\/li>\n<li data-i=\"1\">What happens if you open an existing file with mode <code>&quot;w&quot;<\/code> and write nothing?<\/li>\n<li data-i=\"2\">Why is <code>for line in f:<\/code> better than <code>f.readlines()<\/code> for a 2 GB log file?<\/li>\n<li data-i=\"3\">Write a dictionary to JSON, read it back, and confirm <code>loaded == original<\/code>.<\/li>\n<\/ol>\n<h3 id=\"s-9-10\">9.10 Homework – Chapter 9<\/h3>\n<ol class=\"checklist\" data-cl=\"c9-l2\">\n<li data-i=\"0\"><strong>Note taker:<\/strong> A loop asks the user for notes until they type <code>quit<\/code>, appending each (with a timestamp) to <code>notes.txt<\/code>.<\/li>\n<li data-i=\"1\"><strong>Line statistics:<\/strong> For any text file, print the number of lines, words, characters, and the longest line.<\/li>\n<li data-i=\"2\"><strong>CSV summary:<\/strong> Create <code>sales.csv<\/code> (<code>product,qty,price<\/code>), read it, and write <code>summary.txt<\/code> with per-product totals and the grand total (thousand separators, 2 decimals).<\/li>\n<li data-i=\"3\"><strong>Backup tool:<\/strong> Write <code>backup(path)<\/code> that copies <code>file.txt<\/code> to <code>file_backup.txt<\/code>; refuse to overwrite an existing backup (hint: mode <code>&quot;x&quot;<\/code> or <code>Path.exists()<\/code>).<\/li>\n<li data-i=\"4\"><strong>Search tool:<\/strong> Ask for a keyword and a filename; print each matching line with its line number; handle <code>FileNotFoundError<\/code> gracefully.<\/li>\n<li data-i=\"5\"><strong>Mini database:<\/strong> Persist a list of dictionaries (students) to JSON, with functions <code>add_student<\/code>, <code>delete_student<\/code>, and <code>list_students<\/code>.<\/li>\n<\/ol>\n<hr />\n"}, {"id": "10-objects-and-data-structures-assessment-test", "num": 10, "title": "Objects and Data Structures Assessment Test", "outline": [{"id": "s-part-a-multiple-choice-2-points-each-20-points", "title": "Part A – Multiple Choice (2 points each = 20 points)"}, {"id": "s-part-b-predict-the-output-3-points-each-30-points", "title": "Part B – Predict the Output (3 points each = 30 points)"}, {"id": "s-part-c-coding-challenges-10-points-each-50-points", "title": "Part C – Coding Challenges (10 points each = 50 points)"}, {"id": "s-answer-key", "title": "Answer Key"}], "html_parts": {"intro": "<h2>10. Objects and Data Structures Assessment Test<\/h2>\n<p><strong>Time:<\/strong> 60–75 minutes · <strong>Total:<\/strong> 100 points · <strong>Rules:<\/strong> No internet; the Python shell is allowed for Part C only.<\/p>\n", "paper": "<h3 id=\"s-part-a-multiple-choice-2-points-each-20-points\">Part A – Multiple Choice (2 points each = 20 points)<\/h3>\n<p><strong>A1.<\/strong> What is the result of <code>7 // 2 + 7 % 2 * 2 ** 2<\/code>?<\/p>\n<ul>\n<li>a) 7  b) 5  c) 7.5  d) 3<\/li>\n<\/ul>\n<p><strong>A2.<\/strong> Which variable name is valid?<\/p>\n<ul>\n<li>a) <code>2nd_value<\/code>  b) <code>my-value<\/code>  c) <code>_value2<\/code>  d) <code>class<\/code><\/li>\n<\/ul>\n<p><strong>A3.<\/strong> What does <code>&quot;Python&quot;[1:5:2]<\/code> return?<\/p>\n<ul>\n<li>a) <code>&quot;yh&quot;<\/code>  b) <code>&quot;yo&quot;<\/code>  c) <code>&quot;yt&quot;<\/code>  d) <code>&quot;yth&quot;<\/code><\/li>\n<\/ul>\n<p><strong>A4.<\/strong> What does <code>(5)<\/code> evaluate to?<\/p>\n<ul>\n<li>a) a tuple with one item  b) the integer 5  c) an error  d) an empty tuple<\/li>\n<\/ul>\n<p><strong>A5.<\/strong> After <code>a = [1, 2]; b = a; b.append(3)<\/code>, what is <code>a<\/code>?<\/p>\n<ul>\n<li>a) <code>[1, 2]<\/code>  b) <code>[1, 2, 3]<\/code>  c) <code>[3]<\/code>  d) error<\/li>\n<\/ul>\n<p><strong>A6.<\/strong> Which creates an empty set?<\/p>\n<ul>\n<li>a) <code>{}<\/code>  b) <code>[]<\/code>  c) <code>set()<\/code>  d) <code>()<\/code><\/li>\n<\/ul>\n<p><strong>A7.<\/strong> What does <code>{&quot;a&quot;: 1}.get(&quot;b&quot;, 0)<\/code> return?<\/p>\n<ul>\n<li>a) <code>None<\/code>  b) <code>KeyError<\/code>  c) <code>0<\/code>  d) <code>&quot;b&quot;<\/code><\/li>\n<\/ul>\n<p><strong>A8.<\/strong> Which file mode erases existing content?<\/p>\n<ul>\n<li>a) <code>&quot;r&quot;<\/code>  b) <code>&quot;a&quot;<\/code>  c) <code>&quot;w&quot;<\/code>  d) <code>&quot;r+&quot;<\/code><\/li>\n<\/ul>\n<p><strong>A9.<\/strong> <code>bool([])<\/code> is:<\/p>\n<ul>\n<li>a) <code>True<\/code>  b) <code>False<\/code>  c) error  d) <code>None<\/code><\/li>\n<\/ul>\n<p><strong>A10.<\/strong> What does <code>f&quot;{3.14159:.2f}&quot;<\/code> produce?<\/p>\n<ul>\n<li>a) <code>3.1<\/code>  b) <code>3.14<\/code>  c) <code>3.142<\/code>  d) <code>3.14159<\/code><\/li>\n<\/ul>\n<h3 id=\"s-part-b-predict-the-output-3-points-each-30-points\">Part B – Predict the Output (3 points each = 30 points)<\/h3>\n<p><strong>B1.<\/strong><\/p>\n<figure class=\"cb\" data-bid=\"c10-1\" data-lang=\"python\"><pre class=\"code\"><code>x = [1, 2, 3]\ny = x[:]\ny.append(4)\nprint(x, y)\n<\/code><\/pre><\/figure>\n<p><strong>B2.<\/strong><\/p>\n<figure class=\"cb\" data-bid=\"c10-2\" data-lang=\"python\"><pre class=\"code\"><code>s = \"banana\"\nprint(s.count(\"an\"), s.find(\"na\"), s.replace(\"a\", \"o\", 2))\n<\/code><\/pre><\/figure>\n<p><strong>B3.<\/strong><\/p>\n<figure class=\"cb\" data-bid=\"c10-3\" data-lang=\"python\"><pre class=\"code\"><code>d = {\"a\": 1, \"b\": 2}\nd[\"c\"] = d.get(\"c\", 10) + d[\"a\"]\nprint(sorted(d.items()))\n<\/code><\/pre><\/figure>\n<p><strong>B4.<\/strong><\/p>\n<figure class=\"cb\" data-bid=\"c10-4\" data-lang=\"python\"><pre class=\"code\"><code>a, *b, c = range(5)\nprint(a, b, c)\n<\/code><\/pre><\/figure>\n<p><strong>B5.<\/strong><\/p>\n<figure class=\"cb\" data-bid=\"c10-5\" data-lang=\"python\"><pre class=\"code\"><code>print({1, 2, 3} &amp; {2, 3, 4}, {1, 2} | {2, 5})\n<\/code><\/pre><\/figure>\n<p><strong>B6.<\/strong><\/p>\n<figure class=\"cb\" data-bid=\"c10-6\" data-lang=\"python\"><pre class=\"code\"><code>print(0 or \"\", \"hi\" and 5, not [])\n<\/code><\/pre><\/figure>\n<p><strong>B7.<\/strong><\/p>\n<figure class=\"cb\" data-bid=\"c10-7\" data-lang=\"python\"><pre class=\"code\"><code>nums = [5, 3, 8]\nresult = nums.sort()\nprint(result, nums)\n<\/code><\/pre><\/figure>\n<p><strong>B8.<\/strong><\/p>\n<figure class=\"cb\" data-bid=\"c10-8\" data-lang=\"python\"><pre class=\"code\"><code>print(f\"{255:#x} | {1234567:,} | {0.256:.0%} | {'ab':*&gt;5}\")\n<\/code><\/pre><\/figure>\n<p><strong>B9.<\/strong><\/p>\n<figure class=\"cb\" data-bid=\"c10-9\" data-lang=\"python\"><pre class=\"code\"><code>t = (1, [2, 3])\nt[1].append(4)\nprint(t, len(t))\n<\/code><\/pre><\/figure>\n<p><strong>B10.<\/strong><\/p>\n<figure class=\"cb\" data-bid=\"c10-10\" data-lang=\"python\"><pre class=\"code\"><code>print([n * n for n in range(6) if n % 2 == 0])\n<\/code><\/pre><\/figure>\n<h3 id=\"s-part-c-coding-challenges-10-points-each-50-points\">Part C – Coding Challenges (10 points each = 50 points)<\/h3>\n<p><strong>C1. Number toolkit.<\/strong> Write <code>digit_stats(n)<\/code> returning a tuple <code>(digit_sum, digit_count, largest_digit)<\/code> for a positive integer — using arithmetic only (no string conversion). Test with <code>90517<\/code>.<\/p>\n<p><strong>C2. String cleaner.<\/strong> Write <code>clean_title(text)<\/code> that strips whitespace, collapses multiple internal spaces into one, and returns Title Case. Example: <code>&quot;  the   lord of   THE rings &quot;<\/code> → <code>&quot;The Lord Of The Rings&quot;<\/code>.<\/p>\n<p><strong>C3. List processing.<\/strong> Given <code>data = [4, -2, 7, 0, -9, 3, 7, 4]<\/code>, write code that prints: (a) the list without duplicates preserving order, (b) the sum of positive numbers, (c) the list sorted by absolute value, (d) the index of the first negative number.<\/p>\n<p><strong>C4. Dictionary analytics.<\/strong> Given:<\/p>\n<figure class=\"cb\" data-bid=\"c10-11\" data-lang=\"python\"><pre class=\"code\"><code>sales = [\n    {\"rep\": \"Ali\", \"region\": \"North\", \"amount\": 1200},\n    {\"rep\": \"Sara\", \"region\": \"South\", \"amount\": 950},\n    {\"rep\": \"Ali\", \"region\": \"South\", \"amount\": 400},\n    {\"rep\": \"Reza\", \"region\": \"North\", \"amount\": 780},\n]\n<\/code><\/pre><\/figure>\n<p>Print total sales per rep, total sales per region, and the top rep.<\/p>\n<p><strong>C5. Files + data structures.<\/strong> Write a program that reads <code>names.txt<\/code> (one name per line, possible duplicates and blank lines), then writes <code>unique_sorted.txt<\/code> containing the unique, case-insensitive, sorted names (blank lines removed), and prints how many duplicates were removed. Handle a missing input file gracefully.<\/p>\n<hr />\n", "key": "<h3 id=\"s-answer-key\">Answer Key<\/h3>\n<p><strong>Part A:<\/strong> A1 → <strong>a<\/strong> (<code>7 // 2 = 3<\/code>; <code>7 % 2 = 1<\/code>; <code>2 ** 2 = 4<\/code>; <code>1 * 4 = 4<\/code>; <code>3 + 4 = 7<\/code>) ·\nA2 → <strong>c<\/strong> · A3 → <strong>a<\/strong> (<code>&quot;Python&quot;[1:5:2]<\/code> → indices 1,3 → <code>&quot;yh&quot;<\/code>) · A4 → <strong>b<\/strong> · A5 → <strong>b<\/strong> · A6 → <strong>c<\/strong> · A7 → <strong>c<\/strong> · A8 → <strong>c<\/strong> · A9 → <strong>b<\/strong> · A10 → <strong>b<\/strong><\/p>\n<p><strong>Part B:<\/strong><\/p>\n<ul>\n<li>B1: <code>[1, 2, 3] [1, 2, 3, 4]<\/code><\/li>\n<li>B2: <code>2 2 bonona<\/code> (count of <code>&quot;an&quot;<\/code> = 2; first <code>&quot;na&quot;<\/code> at index 2; replace first two <code>a<\/code> → <code>&quot;bonona&quot;<\/code>)<\/li>\n<li>B3: <code>[('a', 1), ('b', 2), ('c', 11)]<\/code><\/li>\n<li>B4: <code>0 [1, 2, 3] 4<\/code><\/li>\n<li>B5: <code>{2, 3} {1, 2, 5}<\/code><\/li>\n<li>B6: <code>0 or &quot;&quot;<\/code> → <code>&quot;&quot;<\/code> (when all operands are falsy, <code>or<\/code> returns the last one), <code>&quot;hi&quot; and 5<\/code> → <code>5<\/code>, <code>not []<\/code> → <code>True<\/code>. The printed line is an empty string, a space, then <code>5 True<\/code>, i.e. <code> 5 True<\/code><\/li>\n<li>B7: <code>None [3, 5, 8]<\/code><\/li>\n<li>B8: <code>0xff | 1,234,567 | 26% | ***ab<\/code><\/li>\n<li>B9: <code>(1, [2, 3, 4]) 2<\/code><\/li>\n<li>B10: <code>[0, 4, 16]<\/code><\/li>\n<\/ul>\n<p><strong>Part C – Sample solutions<\/strong><\/p>\n<figure class=\"cb\" data-bid=\"c10-12\" data-lang=\"python\"><pre class=\"code\"><code># C1\ndef digit_stats(n):\n    total, count, largest = 0, 0, 0\n    while n &gt; 0:\n        d = n % 10\n        total += d\n        count += 1\n        largest = max(largest, d)\n        n //= 10\n    return total, count, largest\n\nprint(digit_stats(90517))   # (22, 5, 9)\n<\/code><\/pre><\/figure>\n<figure class=\"cb\" data-bid=\"c10-13\" data-lang=\"python\"><pre class=\"code\"><code># C2\ndef clean_title(text):\n    return \" \".join(text.split()).title()\n\nprint(clean_title(\"  the   lord of   THE rings \"))   # The Lord Of The Rings\n<\/code><\/pre><\/figure>\n<figure class=\"cb\" data-bid=\"c10-14\" data-lang=\"python\"><pre class=\"code\"><code># C3\ndata = [4, -2, 7, 0, -9, 3, 7, 4]\n\nunique = []\nfor x in data:\n    if x not in unique:\n        unique.append(x)\nprint(unique)                               # [4, -2, 7, 0, -9, 3]\nprint(sum(x for x in data if x &gt; 0))        # 25\nprint(sorted(data, key=abs))                # [0, -2, 3, 4, 4, 7, 7, -9]\nprint(next(i for i, x in enumerate(data) if x &lt; 0))   # 1\n<\/code><\/pre><\/figure>\n<figure class=\"cb\" data-bid=\"c10-15\" data-lang=\"python\"><pre class=\"code\"><code># C4\nby_rep, by_region = {}, {}\nfor s in sales:\n    by_rep[s[\"rep\"]] = by_rep.get(s[\"rep\"], 0) + s[\"amount\"]\n    by_region[s[\"region\"]] = by_region.get(s[\"region\"], 0) + s[\"amount\"]\n\nprint(by_rep)       # {'Ali': 1600, 'Sara': 950, 'Reza': 780}\nprint(by_region)    # {'North': 1980, 'South': 1350}\nprint(\"Top rep:\", max(by_rep, key=by_rep.get))   # Ali\n<\/code><\/pre><\/figure>\n<figure class=\"cb\" data-bid=\"c10-16\" data-lang=\"python\"><pre class=\"code\"><code># C5\ntry:\n    with open(\"names.txt\", encoding=\"utf-8\") as f:\n        names = [line.strip() for line in f if line.strip()]\nexcept FileNotFoundError:\n    print(\"names.txt not found.\")\nelse:\n    unique = {}\n    for n in names:\n        unique.setdefault(n.lower(), n.title())\n    result = sorted(unique.values())\n    with open(\"unique_sorted.txt\", \"w\", encoding=\"utf-8\") as out:\n        out.write(\"\\n\".join(result) + \"\\n\")\n    print(f\"Removed {len(names) - len(result)} duplicates\")\n<\/code><\/pre><\/figure>\n", "score": "<p><strong>Scoring guide:<\/strong> 90–100 Excellent · 75–89 Good · 60–74 Review weak chapters · &lt; 60 Redo the chapters and homework.<\/p>\n<hr />\n"}, "html": ""}, {"id": "11-appendix", "num": 11, "title": "Appendix", "outline": [{"id": "s-11-1", "title": "11.1 Data structure cheat sheet"}, {"id": "s-11-2", "title": "11.2 Common mistakes checklist"}, {"id": "s-11-3", "title": "11.3 Final project – \"Student Management Console\""}, {"id": "s-11-4", "title": "11.4 Suggested learning path"}], "html": "<h2>11. Appendix<\/h2>\n<h3 id=\"s-11-1\">11.1 Data structure cheat sheet<\/h3>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Literal<\/th>\n<th>Ordered<\/th>\n<th>Mutable<\/th>\n<th>Duplicates<\/th>\n<th>Lookup<\/th>\n<th>Typical use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>str<\/code><\/td>\n<td><code>&quot;abc&quot;<\/code><\/td>\n<td>✅<\/td>\n<td>❌<\/td>\n<td>✅<\/td>\n<td>by index<\/td>\n<td>Text<\/td>\n<\/tr>\n<tr>\n<td><code>list<\/code><\/td>\n<td><code>[1, 2]<\/code><\/td>\n<td>✅<\/td>\n<td>✅<\/td>\n<td>✅<\/td>\n<td>by index<\/td>\n<td>Ordered, changing collections<\/td>\n<\/tr>\n<tr>\n<td><code>tuple<\/code><\/td>\n<td><code>(1, 2)<\/code><\/td>\n<td>✅<\/td>\n<td>❌<\/td>\n<td>✅<\/td>\n<td>by index<\/td>\n<td>Fixed records, multiple returns<\/td>\n<\/tr>\n<tr>\n<td><code>dict<\/code><\/td>\n<td><code>{&quot;a&quot;: 1}<\/code><\/td>\n<td>✅ (insertion)<\/td>\n<td>✅<\/td>\n<td>keys unique<\/td>\n<td>by key<\/td>\n<td>Mappings, records<\/td>\n<\/tr>\n<tr>\n<td><code>set<\/code><\/td>\n<td><code>{1, 2}<\/code><\/td>\n<td>❌<\/td>\n<td>✅<\/td>\n<td>❌<\/td>\n<td>membership<\/td>\n<td>Uniqueness, set algebra<\/td>\n<\/tr>\n<tr>\n<td><code>frozenset<\/code><\/td>\n<td><code>frozenset({1})<\/code><\/td>\n<td>❌<\/td>\n<td>❌<\/td>\n<td>❌<\/td>\n<td>membership<\/td>\n<td>Hashable sets<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Choosing quickly:<\/strong> need order + change → <code>list<\/code> · fixed → <code>tuple<\/code> · label → <code>dict<\/code> · uniqueness / fast <code>in<\/code> → <code>set<\/code>.<\/p>\n<h3 id=\"s-11-2\">11.2 Common mistakes checklist<\/h3>\n<table>\n<thead>\n<tr>\n<th>Mistake<\/th>\n<th>Fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Comparing floats with <code>==<\/code><\/td>\n<td><code>math.isclose()<\/code> or <code>Decimal<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>x = lst.sort()<\/code> gives <code>None<\/code><\/td>\n<td>Use <code>lst.sort()<\/code> alone, or <code>sorted(lst)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>b = a<\/code> expecting a copy<\/td>\n<td><code>b = a.copy()<\/code> / <code>a[:]<\/code> / <code>copy.deepcopy(a)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>[[0]*3]*3<\/code> for a grid<\/td>\n<td><code>[[0]*3 for _ in range(3)]<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>{}<\/code> as empty set<\/td>\n<td><code>set()<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>(5)<\/code> as one-element tuple<\/td>\n<td><code>(5,)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>d[&quot;missing&quot;]<\/code> → <code>KeyError<\/code><\/td>\n<td><code>d.get(&quot;missing&quot;, default)<\/code><\/td>\n<\/tr>\n<tr>\n<td>Forgetting <code>&quot;\\n&quot;<\/code> with <code>write()<\/code><\/td>\n<td>Add <code>\\n<\/code> explicitly<\/td>\n<\/tr>\n<tr>\n<td>Opening with <code>&quot;w&quot;<\/code> and losing data<\/td>\n<td>Use <code>&quot;a&quot;<\/code> for appending<\/td>\n<\/tr>\n<tr>\n<td>Missing <code>encoding=&quot;utf-8&quot;<\/code><\/td>\n<td>Always set it for text files<\/td>\n<\/tr>\n<tr>\n<td>Naming a variable <code>list<\/code>, <code>str<\/code>, <code>dict<\/code>, <code>sum<\/code><\/td>\n<td>Choose descriptive non-built-in names<\/td>\n<\/tr>\n<tr>\n<td>Using <code>is<\/code> to compare numbers/strings<\/td>\n<td>Use <code>==<\/code> (reserve <code>is<\/code> for <code>None<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Modifying a list while iterating over it<\/td>\n<td>Iterate over a copy or build a new list<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"s-11-3\">11.3 Final project – &quot;Student Management Console&quot;<\/h3>\n<p>Combine everything from this module in one program.<\/p>\n<p><strong>Requirements<\/strong><\/p>\n<ol class=\"checklist\" data-cl=\"c11-l1\">\n<li data-i=\"0\">Store students as a <strong>list of dictionaries<\/strong>: <code>{&quot;id&quot;: int, &quot;name&quot;: str, &quot;grades&quot;: [float, ...]}<\/code>.<\/li>\n<li data-i=\"1\">Menu loop (numbers, strings, booleans): <em>Add student · Add grade · Show report · Search by name · Delete · Save &amp; exit<\/em>.<\/li>\n<li data-i=\"2\">Use <strong>sets<\/strong> to prevent duplicate student IDs.<\/li>\n<li data-i=\"3\">Use <strong>tuples<\/strong> for returning <code>(average, highest, lowest)<\/code> from a stats function.<\/li>\n<li data-i=\"4\">Print reports with aligned <strong>f-string tables<\/strong> (names left-aligned, numbers right-aligned with 2 decimals).<\/li>\n<li data-i=\"5\">Persist everything in <code>students.json<\/code> (load at start, save on exit) with <strong>error handling<\/strong> for a missing or corrupt file.<\/li>\n<li data-i=\"6\">Append every action to <code>activity.log<\/code> with a timestamp.<\/li>\n<\/ol>\n<p><strong>Starter skeleton<\/strong><\/p>\n<figure class=\"cb\" data-bid=\"c11-1\" data-lang=\"python\"><pre class=\"code\"><code>import json\nfrom datetime import datetime\nfrom pathlib import Path\n\nDB = Path(\"students.json\")\nLOG = Path(\"activity.log\")\n\ndef log(msg):\n    with LOG.open(\"a\", encoding=\"utf-8\") as f:\n        f.write(f\"[{datetime.now():%Y-%m-%d %H:%M:%S}] {msg}\\n\")\n\ndef load():\n    try:\n        return json.loads(DB.read_text(encoding=\"utf-8\"))\n    except (FileNotFoundError, json.JSONDecodeError):\n        return []\n\ndef save(students):\n    DB.write_text(json.dumps(students, indent=2, ensure_ascii=False), encoding=\"utf-8\")\n\ndef stats(grades):\n    return sum(grades) / len(grades), max(grades), min(grades)\n\ndef show_report(students):\n    print(f\"{'ID':&lt;5}{'Name':&lt;15}{'Avg':&gt;8}{'Max':&gt;8}{'Min':&gt;8}\")\n    print(\"-\" * 44)\n    for s in students:\n        if s[\"grades\"]:\n            avg, hi, lo = stats(s[\"grades\"])\n            print(f\"{s['id']:&lt;5}{s['name']:&lt;15}{avg:&gt;8.2f}{hi:&gt;8.2f}{lo:&gt;8.2f}\")\n        else:\n            print(f\"{s['id']:&lt;5}{s['name']:&lt;15}{'-':&gt;8}{'-':&gt;8}{'-':&gt;8}\")\n\n# TODO: add_student, add_grade, search, delete, and the main menu loop\n<\/code><\/pre><\/figure>\n<p><strong>Grading rubric (20 points):<\/strong> correct data structures (5) · formatting (3) · file persistence (4) · error handling (3) · code clarity &amp; naming (3) · extra feature of your choice, e.g., ranking, CSV export (2).<\/p>\n<h3 id=\"s-11-4\">11.4 Suggested learning path<\/h3>\n<ol>\n<li>Complete all chapter <em>Try It<\/em> sections the same day you read them.<\/li>\n<li>Do the homework within 48 hours; re-solve the ones you got wrong a week later.<\/li>\n<li>Take the assessment <em>without<\/em> looking at the notes; review wrong answers by chapter.<\/li>\n<li>Build the final project, then move on to <strong>control flow, functions, and modules<\/strong>, the natural next step.<\/li>\n<\/ol>\n<hr />\n<p><em>End of document.<\/em><\/p>\n"}]};

function bindExercise(k, ex, card, onChange) {

var INDEX = null;
function buildIndex() {
  if (INDEX) return INDEX;
  INDEX = [];
  PAGES.forEach(function (p) {
    var d = p.doc, htmls = d.html_parts ? [d.html_parts.intro, d.html_parts.paper, d.html_parts.key, d.html_parts.score] : [d.html];
    htmls.forEach(function (hh) {
      var dom = new DOMParser().parseFromString('<body>' + hh + '</body>', 'text/html'), cur = { id: p.id, title: pageTitle(p), parts: [] }, secs = [cur];
      Array.prototype.forEach.call(dom.body.children, function (el) {
        if (el.tagName === 'H3' || el.tagName === 'H2') { cur = { id: el.id || p.id, title: el.textContent, parts: [] }; secs.push(cur); }
        cur.parts.push(el.textContent);
      });
      secs.forEach(function (s) { var text = s.parts.join(' ').replace(/\s+/g, ' '); if (text.trim()) INDEX.push({ page: p, id: s.id, title: s.title, text: text, low: (s.title + ' ' + text).toLowerCase() }); });
    });
  });
  return INDEX;
}
function snippet(text, words) {
  var low = text.toLowerCase(), pos = -1;
  words.forEach(function (w) { var i = low.indexOf(w); if (i >= 0 && (pos < 0 || i < pos)) pos = i; });
  var a = Math.max(0, pos - 40), s = text.slice(a, a + 130);
  s = esc(s);
  words.forEach(function (w) { if (w.length > 1) s = s.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>'); });
  return (a > 0 ? '…' : '') + s + '…';
}
function doSearch(q) {
  var box = $('#results');
  q = q.trim().toLowerCase();
  if (!q) { box.hidden = true; box.innerHTML = ''; return; }
  var words = q.split(/\s+/), hits = [];
  buildIndex().forEach(function (s) {
    for (var i = 0; i < words.length; i++) if (s.low.indexOf(words[i]) < 0) return;
    var score = (s.title.toLowerCase().indexOf(words[0]) >= 0 ? 2 : 0);
    hits.push({ s: s, score: score });
  });
  hits.sort(function (a, b) { return b.score - a.score; });
  box.hidden = false;
  if (!hits.length) { box.innerHTML = '<p class="res-none">' + esc(t('noResults')) + '</p>'; return; }
  box.innerHTML = '';
  hits.slice(0, 12).forEach(function (h) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'res';
    b.innerHTML = '<b>' + esc((h.s.page.num ? h.s.page.num + '. ' : '') + pageTitle(h.s.page) + (h.s.title !== pageTitle(h.s.page) ? ' › ' + h.s.title : '')) + '</b><span dir="ltr" lang="en">' + snippet(h.s.text, words) + '</span>';
    b.addEventListener('click', function () { go(h.s.id === h.s.page.id ? h.s.page.id : h.s.id); });
    box.appendChild(b);
  });
}

var CFG = window.TRACEPAD_CONFIG || {};
var sb = null, me = null;                 // me: { id, full_name, username, role }
var synced = {};                          // key -> canonical JSON last known to be on the server
var syncTimer = 0, cacheTimer = 0, retryTimer = 0, syncBusy = false, syncDirty = false;

function canon(o) {
  if (o === null || typeof o !== 'object') return JSON.stringify(o);
  if (Array.isArray(o)) return '[' + o.map(canon).join(',') + ']';
  return '{' + Object.keys(o).sort().map(function (k) { return JSON.stringify(k) + ':' + canon(o[k]); }).join(',') + '}';
}
function pageNumOf(id) { var p = pageById(id); return p ? p.num : 0; }
function labDef(k) { var p = PAGES[+k]; return p ? labOf(p) : null; }
function findBy(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }

/* The learner's state as database rows: one small JSON document per thing they did. */
function rowsFromStore() {
  var r = {};
  Object.keys(store.preds).forEach(function (k) {
    Object.keys(store.preds[k]).forEach(function (id) { var x = store.preds[k][id]; r['pred:' + k + ':' + id] = { guess: x.guess, out: x.out, right: !!x.right }; });
  });
  Object.keys(store.quiz).forEach(function (k) {
    var lab = labDef(k);
    Object.keys(store.quiz[k]).forEach(function (id) {
      var q = lab ? findBy(lab.quizzes, id) : null, choice = store.quiz[k][id];
      r['quiz:' + k + ':' + id] = { choice: choice, right: !!q && q.correct === choice };
    });
  });
  var xs = {};
  ['exPass', 'exBest', 'hints', 'peek', 'code'].forEach(function (m) { Object.keys(store[m]).forEach(function (xk) { xs[xk] = 1; }); });
  Object.keys(xs).forEach(function (xk) {
    if (!/^\d+:/.test(xk)) return;
    r['ex:' + xk] = { pass: !!store.exPass[xk], best: store.exBest[xk] | 0, hints: store.hints[xk] | 0, peek: !!store.peek[xk], code: String(store.code[xk] || '').slice(0, 20000) };
  });
  Object.keys(store.read).forEach(function (pid) { if (store.read[pid]) r['read:' + pageNumOf(pid)] = { t: 1 }; });
  Object.keys(store.cl).forEach(function (k) { if (Object.keys(store.cl[k]).length) r['cl:' + k] = { items: store.cl[k] }; });
  Object.keys(store.miss).forEach(function (g) { if (store.miss[g] > 0) r['miss:' + g] = { n: store.miss[g] }; });
  if (store.vfs && (Object.keys(store.vfs.files || {}).length || (store.vfs.dirs || []).length)) r['meta:vfs'] = store.vfs;
  return r;
}
function storeFromRows(map) {
  ['preds', 'quiz', 'miss', 'hints', 'code', 'peek', 'exPass', 'exBest', 'read', 'cl'].forEach(function (k) { store[k] = {}; });
  store.vfs = null;
  Object.keys(map).forEach(function (key) {
    var d = map[key], p = key.split(':'), kind = p[0];
    if (kind === 'pred') { (store.preds[p[1]] = store.preds[p[1]] || {})[p[2]] = { guess: d.guess, out: d.out, right: !!d.right }; }
    else if (kind === 'quiz') { (store.quiz[p[1]] = store.quiz[p[1]] || {})[p[2]] = d.choice; }
    else if (kind === 'ex') {
      var xk = p[1] + ':' + p[2];
      if (d.pass) store.exPass[xk] = true;
      if (d.best) store.exBest[xk] = d.best;
      if (d.hints) store.hints[xk] = d.hints;
      if (d.peek) store.peek[xk] = true;
      if (d.code) store.code[xk] = d.code;
    }
    else if (kind === 'read') { var pg = PAGES[+p[1]]; if (pg) store.read[pg.id] = 1; }
    else if (kind === 'cl') { store.cl[key.slice(3)] = d.items || {}; }
    else if (kind === 'miss') { store.miss[key.slice(5)] = d.n; }
    else if (key === 'meta:vfs') { store.vfs = d; }
  });
}

/* ---- local cache, so changes made offline survive a reload ---- */
function cacheKey() { return 'tracepad.cache.v1.' + (me ? me.id : ''); }
function persistLocal() {
  if (!me) return;
  try { localStorage.setItem(cacheKey(), JSON.stringify({ rows: rowsFromStore(), synced: synced })); } catch (e) { /* quota or private mode: ignore */ }
}
function readLocal() { try { return JSON.parse(localStorage.getItem(cacheKey()) || 'null'); } catch (e) { return null; } }

function setSync(state) {
  var e = $('#syncState'); if (!e) return;
  e.setAttribute('data-state', state);
  e.textContent = state === 'saved' ? t('syncSaved') : state === 'offline' ? t('syncOffline') : t('syncSaving');
}
var lastSig = '';
function cloudTouch() {
  if (!me || !sb) return;
  var sig = canon(rowsFromStore());
  if (sig === lastSig) return;          // only device choices changed (page, language, theme): nothing to save
  lastSig = sig;
  setSync('saving');
  clearTimeout(cacheTimer); cacheTimer = setTimeout(persistLocal, 250);
  clearTimeout(syncTimer); syncTimer = setTimeout(flush, 900);
}
async function flush() {
  if (!sb || !me) return;
  if (syncBusy) { syncDirty = true; return; }
  syncBusy = true;
  try {
    var cur = rowsFromStore(), up = [], del = [];
    Object.keys(cur).forEach(function (k) { if (canon(cur[k]) !== synced[k]) up.push(k); });
    Object.keys(synced).forEach(function (k) { if (!(k in cur)) del.push(k); });
    for (var i = 0; i < up.length; i += 100) {
      var batch = up.slice(i, i + 100).map(function (k) { return { user_id: me.id, key: k, data: cur[k], updated_at: new Date().toISOString() }; });
      var r = await sb.from('progress').upsert(batch, { onConflict: 'user_id,key' });
      if (r.error) throw r.error;
      batch.forEach(function (b) { synced[b.key] = canon(b.data); });
    }
    for (var j = 0; j < del.length; j += 100) {
      var chunk = del.slice(j, j + 100);
      var r2 = await sb.from('progress').delete().eq('user_id', me.id).in('key', chunk);
      if (r2.error) throw r2.error;
      chunk.forEach(function (k) { delete synced[k]; });
    }
    persistLocal(); setSync('saved');
  } catch (e) {
    setSync('offline'); clearTimeout(retryTimer); retryTimer = setTimeout(flush, 6000);
  }
  syncBusy = false;
  if (syncDirty) { syncDirty = false; clearTimeout(syncTimer); syncTimer = setTimeout(flush, 300); }
}
async function hydrate() {
  var rows = [], from = 0;
  for (;;) {
    var r = await sb.from('progress').select('key,data').eq('user_id', me.id).order('key').range(from, from + 999);
    if (r.error) throw r.error;
    rows = rows.concat(r.data || []);
    if (!r.data || r.data.length < 1000) break;
    from += 1000;
  }
  var server = {}, final = {};
  rows.forEach(function (x) { server[x.key] = x.data; final[x.key] = x.data; });
  var local = readLocal();
  if (local && local.rows) {      // changes made on this device that never reached the server
    Object.keys(local.rows).forEach(function (k) { if (canon(local.rows[k]) !== (local.synced || {})[k]) final[k] = local.rows[k]; });
    Object.keys(local.synced || {}).forEach(function (k) { if (!(k in local.rows)) delete final[k]; });
  }
  synced = {}; Object.keys(server).forEach(function (k) { synced[k] = canon(server[k]); });
  storeFromRows(final);
  vfsReset(store.vfs && store.vfs.files, store.vfs && store.vfs.dirs);
  lastSig = canon(rowsFromStore());
  setSync('saved'); flush();
}
async function cloudReset() {
  if (!sb || !me) return;
  var r = await sb.from('progress').delete().eq('user_id', me.id);
  if (r.error) throw r.error;
  synced = {}; storeFromRows({}); vfsReset(); lastSig = canon(rowsFromStore()); persistLocal();
}

/* ---- accounts ---- */
function toEmail(id) {
  id = String(id).trim();
  if (id.indexOf('@') >= 0) return id.toLowerCase();
  return id.toLowerCase() + '@' + (CFG.usernameDomain || 'students.tracepad.app');
}
async function loadProfile(uid) {
  for (var i = 0; i < 4; i++) {
    var r = await sb.from('profiles').select('id,full_name,username,role').eq('id', uid).maybeSingle();
    if (r.error) throw r.error;
    if (r.data) return r.data;
    await new Promise(function (ok) { setTimeout(ok, 400); });      // the sign-up trigger may still be running
  }

}
function showApp(on) {
  $('.layout').hidden = !on; $('#userBox').hidden = !on; $('#auth').hidden = on; $('.foot').hidden = !on;
}
async function enterApp(user) {
  var prof = await loadProfile(user.id);
  me = { id: prof.id, full_name: prof.full_name, username: prof.username, role: prof.role };
  await hydrate();
  showApp(true); paintUser();
  var want = store.cur;
  if (!want || (me.role === 'student' && /^(classes|class\/|student\/)/.test(want)) || (me.role === 'teacher' && want === 'home')) want = me.role === 'teacher' ? 'classes' : 'home';
  if (store.cur === 'overview') want = me.role === 'teacher' ? 'classes' : 'home';
  curPage = null; applyLang(); renderWatch(); go(want);
}
function paintUser() {
  if (!me) return;
  $('#whoami').textContent = (me.full_name || me.username || '') + ' · ' + t(me.role === 'teacher' ? 'roleTeacher' : 'roleStudent');
  $('#signOutBtn').textContent = t('signOut');
}
async function cloudSignOut() {
  try { clearTimeout(syncTimer); await flush(); } catch (e) { /* ignore */ }
  try { await sb.auth.signOut(); } catch (e) { /* ignore */ }
  me = null; synced = {}; storeFromRows({}); vfsReset(); curPage = null;
  showAuth();
}

var authMode = 'in';
var authViewMarkup = null;

  return response.text();

  lab.quizzes.forEach(function (x) { var c = (store.quiz[k] || {})[x.id]; s.qt++; if (c !== undefined) { s.done++; if (c === x.correct) s.qr++; } });

  var foot = '<tr class="avg"><th scope="row">' + esc(t('classAvg')) + '</th>' + avgCells + '<td>' + Math.round(aAssess) + '/90</td><td class="heat" style="' + pctColor(aPct) + '">' + Math.round(aPct * 100) + '%</td><td></td></tr>';
  var tally = {}; miss.forEach(function (r) { var g = r.key.slice(5); tally[g] = (tally[g] || 0) + (r.data && r.data.n || 0); });
  var tags = Object.keys(tally).filter(function (g) { return TAGS[g]; }).sort(function (a, b) { return tally[b] - tally[a]; }).slice(0, 8);
  var weak = tags.length ? '<ul class="weak">' + tags.map(function (g) { return '<li><span>' + esc(L(TAGS[g])) + '</span><b>×' + tally[g] + '</b><button type="button" class="mini" data-go="' + esc(DOC.chapters[TAGS[g].ch - 1].id) + '">' + esc(t('open')) + '</button></li>'; }).join('') + '</ul>' : '<p class="help">' + esc(t('noStruggle')) + '</p>';
  return '<div class="tbl-wrap"><table class="dash"><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody><tfoot>' + foot + '</tfoot></table></div>' +
    '<section class="sec"><h3>' + esc(t('struggleH')) + '</h3>' + weak + '</section>';
}
function assignPanel(asg, students) {
  var opts = '';
  for (var n = 1; n <= 10; n++) opts += '<option value="' + esc(PAGES[n].id) + '">' + n + '. ' + esc(chTitle(n)) + '</option>';
  var list = asg.length ? '<ul class="alist">' + asg.map(function (a) {
    var p = pageById(a.page_id), n = p ? p.num : 0, tot = chapterTotal(n), fin = 0;
    students.forEach(function (s) { var r = s.rows[n]; var d = r ? r.preds + r.quizzes + r.ex_pass : 0; if (tot && d >= tot) fin++; });
    return '<li class="card arow"><div class="agrow"><strong>' + esc(a.title || (p ? pageTitle(p) : a.page_id)) + '</strong><button type="button" class="mini" data-rm="' + a.id + '">' + esc(t('removeAssign')) + '</button></div>' +
      '<div class="note">' + (a.due_at ? esc(t('due')) + ' ' + esc(fmtDate(a.due_at)) : esc(t('noDue'))) + ' · ' + esc(t('completeN', { n: fin, m: students.length })) + '</div>' +
      '<div class="bar"><i style="width:' + (students.length ? Math.round(100 * fin / students.length) : 0) + '%"></i></div></li>';
  }).join('') + '</ul>' : '<p class="help">' + esc(t('noAssignments')) + '</p>';
  return list + '<form class="card joinform" id="newAssign"><h4>' + esc(t('newAssign')) + '</h4>' +
    '<div class="field"><label for="as-page">' + esc(t('pickPage')) + '</label><select id="as-page">' + opts + '</select></div>' +
    '<div class="field"><label for="as-title">' + esc(t('assignTitle')) + '</label><input id="as-title" maxlength="100" autocomplete="off"></div>' +
    '<div class="field"><label for="as-due">' + esc(t('dueDate')) + '</label><input id="as-due" type="date" dir="ltr"></div>' +
    '<div><button type="submit" class="btn">' + esc(t('addAssign')) + '</button></div><div id="aMsg" aria-live="polite"></div></form>';
}
function bindAssign(main, classId) {
  $$('[data-rm]', main).forEach(function (b) {
    var armed = false;
    b.addEventListener('click', async function () {
      if (!armed) { armed = true; b.textContent = t('removeSure'); setTimeout(function () { armed = false; b.textContent = t('removeAssign'); }, 4000); return; }
      try { qerr(await sb.from('assignments').delete().eq('id', b.getAttribute('data-rm'))); renderView(); } catch (e) { failView(main, e, renderView); }
    });
  });
  $('#newAssign', main).addEventListener('submit', async function (e) {
    e.preventDefault();
    var page = $('#as-page', main).value, title = $('#as-title', main).value.trim(), due = $('#as-due', main).value;
    var dueIso = null;
    if (due) { var p = due.split('-'); dueIso = new Date(+p[0], +p[1] - 1, +p[2], 23, 59, 59).toISOString(); }
    if (!title) title = pageTitle(pageById(page));
    var r = await sb.from('assignments').insert({ class_id: classId, page_id: page, title: title, due_at: dueIso });
    if (r.error) { $('#aMsg', main).innerHTML = '<div class="banner info">' + esc(t('errGeneric', { msg: r.error.message })) + '</div>'; return; }
    renderView();
  });
}

/* ---------- teacher: one student ---------- */
async function renderStudent(main, classId, uid, tok, chSel) {
  var prof, rows = [];
  try {
    prof = qerr(await sb.from('profiles').select('id,full_name,username').eq('id', uid).single());
    for (var from = 0; ; from += 1000) {
      var part = qerr(await sb.from('progress').select('key,data,updated_at').eq('user_id', uid).order('key').range(from, from + 999));
      rows = rows.concat(part); if (part.length < 1000) break;
    }
  } catch (e) { if (tok === viewTok) failView(main, e, renderView); return; }
  if (tok !== viewTok) return;
  var map = {}, last = null;
  rows.forEach(function (r) { map[r.key] = r.data; if (!last || r.updated_at > last) last = r.updated_at; });
  function stats(n) {
    var lab = labDef(n), k = String(n), s = { pr: 0, pt: 0, pa: 0, qr: 0, qt: 0, qa: 0, ex: 0, et: 0, hints: 0 };
    if (!lab) return s;
    lab.predictions.forEach(function (x) { s.pt++; var d = map['pred:' + k + ':' + x.id]; if (d) { s.pa++; if (d.right) s.pr++; } });
    lab.quizzes.forEach(function (x) { s.qt++; var d = map['quiz:' + k + ':' + x.id]; if (d) { s.qa++; if (d.choice === x.correct) s.qr++; } });
    lab.exercises.forEach(function (x) { s.et++; var d = map['ex:' + k + ':' + x.id]; if (d) { if (d.pass) s.ex++; s.hints += d.hints || 0; } });
    return s;
  }
  var h = '<header class="lh"><p class="eyebrow"><button type="button" class="pill-link" data-go="class/' + esc(classId) + '">← ' + esc(t('back')) + '</button></p><h2>' + esc(prof.full_name || prof.username || '—') + '</h2>' +
    '<p class="help">' + esc(t('lastCol')) + ': ' + esc(fmtWhen(last)) + (prof.username ? ' · @' + esc(prof.username) : '') + '</p></header>';
  var trs = '', pts = { a: 0, b: 0, c: 0 };
  for (var n = 1; n <= 10; n++) {
    var s = stats(n), rd = map['read:' + n] ? '✓' : '';
    if (n === 10) { pts.a = s.qr * 2; pts.b = s.pr * 3; pts.c = s.ex * 10; }
    trs += '<tr data-ch="' + n + '" tabindex="0"><td>' + n + '. ' + esc(chTitle(n)) + '</td><td>' + s.pr + '/' + s.pt + '</td><td>' + s.qr + '/' + s.qt + '</td><td>' + s.ex + '/' + s.et + '</td><td>' + s.hints + '</td><td>' + rd + '</td></tr>';
  }
  h += '<div class="score-card"><span class="chip">' + esc(t('assessScore')) + '</span><strong>' + (pts.a + pts.b + pts.c) + ' / 90</strong><span class="note">A ' + pts.a + '/20 · B ' + pts.b + '/30 · C ' + pts.c + '/40</span></div>';
  h += '<div class="tbl-wrap"><table class="dash clickable"><thead><tr><th>' + esc(t('chapterCol')) + '</th><th>' + esc(t('predCol')) + '</th><th>' + esc(t('quizCol')) + '</th><th>' + esc(t('exCol')) + '</th><th>' + esc(t('hintsUsed')) + '</th><th>' + esc(t('readCol')) + '</th></tr></thead><tbody>' + trs + '</tbody></table></div>';
  var weak = rows.filter(function (r) { return r.key.indexOf('miss:') === 0 && TAGS[r.key.slice(5)]; }).sort(function (a, b) { return b.data.n - a.data.n; });
  h += '<section class="sec"><h3>' + esc(t('weakH')) + '</h3>' + (weak.length ? '<ul class="weak">' + weak.map(function (r) { return '<li><span>' + esc(L(TAGS[r.key.slice(5)])) + '</span><b>×' + r.data.n + '</b></li>'; }).join('') + '</ul>' : '<p class="help">' + esc(t('noWeak')) + '</p>') + '</section>';
  var sel = +chSel || 0;
  if (sel >= 1 && sel <= 10) h += chapterDetail(sel, map);
  main.innerHTML = h;
  $$('[data-go]', main).forEach(function (b) { b.addEventListener('click', function () { go(b.getAttribute('data-go')); }); });
  $$('tr[data-ch]', main).forEach(function (tr) {
    function open() { go('student/' + classId + '/' + uid + '/' + tr.getAttribute('data-ch')); }
    tr.addEventListener('click', open); tr.addEventListener('keydown', function (e) { if (e.key === 'Enter') open(); });
  });
  if (sel) { var d = $('#chdetail', main); if (d) d.scrollIntoView({ block: 'start' }); }
}
function chapterDetail(n, map) {
  var lab = labDef(n), k = String(n), h = '<section class="sec" id="chdetail"><h3>' + n + '. ' + esc(chTitle(n)) + '</h3>';
  h += '<h4>' + esc(t(n === 10 ? 'partB' : 'predictH')) + '</h4><ul class="alist">' + lab.predictions.map(function (x) {
    var d = map['pred:' + k + ':' + x.id];
    return '<li class="card arow"><pre class="code" dir="ltr">' + esc(x.code) + '</pre>' + (d ? '<div class="note mono">' + esc(t('guessVs')) + ': ' + esc(d.guess) + ' → ' + esc(d.out) + ' <span class="tag ' + (d.right ? 'st-done' : 'bad') + '">' + esc(d.right ? t('yes') : t('no')) + '</span></div>' : '<div class="note">' + esc(t('unanswered')) + '</div>') + '</li>';
  }).join('') + '</ul>';
  if (lab.quizzes.length) h += '<h4>' + esc(t(n === 10 ? 'partA' : 'quizH')) + '</h4><ul class="alist">' + lab.quizzes.map(function (x) {
    var d = map['quiz:' + k + ':' + x.id], opt = function (j) { return esc(L(x.options[j]).replace(/<[^>]+>/g, '')); };
    return '<li class="card arow"><div>' + L(x.q) + '</div>' + (d ? '<div class="note">' + esc(t('picked')) + ': ' + opt(d.choice) + ' <span class="tag ' + (d.choice === x.correct ? 'st-done' : 'bad') + '">' + esc(d.choice === x.correct ? t('yes') : t('no')) + '</span>' + (d.choice === x.correct ? '' : ' · ' + esc(t('correctIs')) + ': ' + opt(x.correct)) + '</div>' : '<div class="note">' + esc(t('unanswered')) + '</div>') + '</li>';
  }).join('') + '</ul>';
  if (lab.exercises.length) h += '<h4>' + esc(t(n === 10 ? 'partC' : 'practiceH')) + '</h4><ul class="alist">' + lab.exercises.map(function (x) {
    var d = map['ex:' + k + ':' + x.id];
    return '<li class="card arow"><div class="agrow"><strong>' + esc(x.title || x.id) + '</strong>' + (d && d.pass ? '<span class="tag st-done">' + esc(t('pass')) + '</span>' : '<span class="tag">' + esc(d ? t('inProgress') : t('notStarted')) + '</span>') + '</div>' +
      (d ? '<div class="note">' + esc(t('hintsUsed')) + ': ' + (d.hints || 0) + (d.peek ? ' · ' + esc(t('peeked')) : '') + '</div>' + (d.code ? '<details class="fold"><summary>' + esc(t('attempts')) + '</summary><pre class="code" dir="ltr">' + esc(d.code) + '</pre></details>' : '') : '') + '</li>';
  }).join('') + '</ul>';
  return h + '</section>';
}

/* ---------- boot ---------- */
function renderCurrent() {
  if (curPage && curPage.kind === 'view') { renderNav(); return renderView(); }
  renderNav(); renderPage(curPage || pageById(store.cur) || PAGES[0]);
}
function renderAll() {
  applyLang(); renderNav(); renderWatch(); paintUser();
  if (!me) return showAuth();
  renderCurrent();
}
function boot() {
  loadDevice();
  applyTheme();
  if (typeof Sk === 'undefined') { var eb = $('#engineError'); eb.hidden = false; eb.textContent = t('engineErr'); }
  else setupEngine();
  initCloud();
  $$('.seg button[data-lang]').forEach(function (b) { b.addEventListener('click', function () { store.lang = b.getAttribute('data-lang'); saveStore(); renderAll(); doSearch($('#q').value); }); });
  $('#themeBtn').addEventListener('click', function () { store.theme = store.theme === 'auto' ? 'light' : store.theme === 'light' ? 'dark' : 'auto'; saveStore(); applyTheme(); });
  $('#signOutBtn').addEventListener('click', cloudSignOut);
  var armed = false, rb = $('#resetBtn');
  rb.addEventListener('click', async function () {
    if (!armed) { armed = true; rb.textContent = t('resetConfirm'); setTimeout(function () { armed = false; rb.textContent = t('reset'); }, 4000); return; }
    armed = false;
    try { await cloudReset(); } catch (e) { alert_(t('errGeneric', { msg: String(e.message || e) })); }
    renderAll();
  });
  var q = $('#q'), tm = 0;
  q.addEventListener('input', function () { clearTimeout(tm); tm = setTimeout(function () { doSearch(q.value); }, 120); });
  q.addEventListener('keydown', function (e) { if (e.key === 'Escape') { q.value = ''; doSearch(''); } });
  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (!a || !me) return;
    var id = decodeURIComponent(a.getAttribute('href').slice(1));
    if (!id) return;
    e.preventDefault(); go(id);
  });
  window.addEventListener('hashchange', function () { if (!me) return; var id = decodeURIComponent(location.hash.slice(1)); if (id) go(id); });
  window.addEventListener('beforeunload', function () { if (me) persistLocal(); });
  applyLang();
  if (!sb) return showAuth();
  sb.auth.getSession().then(function (r) {
    var s = r.data && r.data.session;
    if (!s) return showAuth();
    enterApp(s.user).catch(function (e) { showAuth(t('errGeneric', { msg: String(e && e.message || e) })); });
  });
}
window.TP = { go: go, pages: PAGES, store: store, whoami: function () { return me; } };
boot();
})();

</script>
