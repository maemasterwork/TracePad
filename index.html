<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracepad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="styles.css">
<div class="wrap">
  <div id="engineError" class="banner info engine-error" role="alert" hidden></div>
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <rect x="1.5" y="1.5" width="37" height="37" rx="9" stroke="currentColor" stroke-width="2"></rect>
        <circle cx="11" cy="13" r="2.6" fill="currentColor"></circle>
        <circle cx="11" cy="27" r="2.6" fill="currentColor"></circle>
        <rect x="23" y="9" width="10" height="9" rx="2" stroke="currentColor" stroke-width="2"></rect>
        <path d="M13.8 13 C18 13 18 13.5 22 13.5 M13.8 27 C18 27 19 17 22 15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        <rect x="23" y="22" width="10" height="9" rx="2" stroke="currentColor" stroke-width="2" opacity="0.45"></rect>
      </svg>
      <div>
        <h1>Tracepad</h1>
        <p data-i18n="tagline"></p>
      </div>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="en" lang="en">EN</button>
        <button type="button" data-lang="fa" lang="fa">فارسی</button>
      </div>
      <button type="button" class="ghost" id="themeBtn"></button>
      <div id="userBox" class="userbox" hidden>
        <span id="syncState" class="sync" data-state="saved" aria-live="polite"></span>
        <span id="whoami" class="whoami"></span>
        <button type="button" class="ghost" id="signOutBtn"></button>
      </div>
    </div>
  </header>

  <div id="auth" class="auth" hidden></div>

  <div class="layout" hidden>
    <aside class="side">
      <section class="search">
        <label class="sr" for="q" data-i18n="searchLabel"></label>
        <input id="q" type="search" autocomplete="off" spellcheck="false">
        <div id="results" role="region" aria-live="polite" hidden></div>
      </section>
      <section class="s-lessons">
        <h2 data-i18n="lessonH"></h2>
        <nav id="nav" aria-label="Lesson 1"></nav>
      </section>
      <section class="s-watch">
        <h2 data-i18n="watchTitle"></h2>
        <div id="watch" class="watch-card"></div>
      </section>
      <button type="button" class="reset" id="resetBtn"></button>
    </aside>
    <main id="main"></main>
  </div>
  <p class="foot" data-i18n="footnote" hidden></p>
</div>

(a > b) - (a < b)\n\n    def __eq__(self, other):\n        c = self._cmp(other)\n        return False if c is None else c == 0\n\n    def __ne__(self, other):\n        return not self.__eq__(other)\n\n    def __lt__(self, other):\n        c = self._cmp(other)\n        if c is None:\n            return NotImplemented\n        return c < 0\n\n    def __le__(self, other):\n        c = self._cmp(other)\n        if c is None:\n            return NotImplemented\n        return c <= 0\n\n    def __gt__(self, other):\n        c = self._cmp(other)\n        if c is None:\n            return NotImplemented\n        return c > 0\n\n    def __ge__(self, other):\n        c = self._cmp(other)\n        if c is None:\n            return NotImplemented\n        return c >= 0\n\n    def __hash__(self):\n        i, e = self._i, self._e\n        while i != 0 and i % 10 == 0:\n            i //= 10\n            e += 1\n        return hash((i, e if i != 0 else 0))\n\n    def quantize(self, exp, rounding=None):\n        mode = rounding or _ctx.rounding\n        target = exp._e\n        if target <= self._e:\n            return Decimal._make(self._i * _pow10(self._e - target), target)\n        i = _divide_round(self._i, _pow10(target - self._e), mode)\n        return Decimal._make(i, target)\n\n    def __round__(self, ndigits=None):\n        if ndigits is None:\n            return int(self.quantize(Decimal(1)))\n        return self.quantize(Decimal._make(1, -ndigits))\n\n    def __str__(self):\n        i, e = self._i, self._e\n        sign = '-' if i < 0 else ''\n        digits = str(abs(i))\n        if e == 0:\n            return sign + digits\n        if e > 0:\n            adj = e + len(digits) - 1\n            if adj >= 6 or True:\n                if e > 0:\n                    # scientific form like CPython for positive exponents\n                    body = digits[0] + ('.' + digits[1:] if len(digits) > 1 else '')\n                    return sign + body + 'E+' + str(adj)\n        adj =     lab.quizzes.forEach(function (x) { bindQuiz(k, x, $('[data-quiz="' + x.id + '"]', main), onChange); });

  }

  $$('[data-go]', main).forEach(function (b) { b.addEventListener('click', function () { go(b.getAttribute('data-go')); }); });

}

function lessonIsComplete(num) {
  if (num === 11) return !!store.read[PAGES[num].id];
  var page = PAGES[num], totals = labTotals(page);
  return totals.total > 0 && totals.done >= totals.total;
}
function paintLessonReview(page) {
  var actions = $('#lesson-review-actions');
  if (!actions || !studentLessonContext || studentLessonContext.lessonNum !== page.num) return;
  var context = studentLessonContext, button = $('#submitLesson', actions), help = $('[data-submit-help]', actions), message = $('.lesson-submit-message', actions);
  if (context.status === 'accepted') {
    help.textContent = t('lessonSubmitAccepted'); button.hidden = true; return;
  }
  if (context.status === 'submitted') {
    help.textContent = t('lessonSubmitWait'); button.hidden = true; return;
  }
  var complete = lessonIsComplete(page.num);
  help.textContent = complete ? t('lessonSubmitReady') : t('lessonSubmitHelp');
  button.hidden = false;
  button.textContent = context.busy ? t('lessonSubmitting') : t('lessonSubmit');
  button.disabled = !!context.busy || !complete;
  if (!button.dataset.bound) {
    button.dataset.bound = 'true';
    button.addEventListener('click', async function () {
      if (!lessonIsComplete(page.num) || context.busy) return;
      context.busy = true; message.textContent = ''; paintLessonReview(page);
      try {
        while (syncBusy) await new Promise(function (resolve) { setTimeout(resolve, 30); });
        clearTimeout(syncTimer); syncDirty = false;
        await flush();
        while (syncBusy) await new Promise(function (resolve) { setTimeout(resolve, 30); });
        var result = await sb.rpc('submit_lesson', { p_class: context.classId, p_lesson: context.lessonNum });
        if (result.error) throw result.error;
        context.status = 'submitted';
        message.textContent = t('lessonSubmitted');
        paintLessonReview(page);
      } catch (e) {
        context.busy = false;
        message.textContent = t('lessonSubmitError', { msg: String(e && e.message || e) });
        paintLessonReview(page);
      }
    });
  }
}

/* ---------- routing ---------- */
function openAncestors(el) { for (var n = el; n; n = n.parentElement) if (n.tagName === 'DETAILS') n.open = true; }
function scrollToId(id) {
  var el = document.getElementById(id);
  if (!el) { try { el = document.querySelector('[id="' + id + '"]'); } catch (e) { el = null; } }
  if (el) { openAncestors(el); el.scrollIntoView({ block: 'start' }); } else window.scrollTo(0, 0);
}
function go(id, replace) {
  if (isViewId(id)) return goView(id);
  if (me && me.role === 'student') {
    var target = pageById(id) || pageById(SEC2PAGE[id]);
    if (!studentLessonContext || !target || target.num !== studentLessonContext.lessonNum) return goView('home');
  }
  var pid = id, sec = null;
  if (!pageById(id)) { if (SEC2PAGE[id]) { pid = SEC2PAGE[id]; sec = id; } else pid = 'overview'; }
  var changed = !curPage || curPage.id !== pid || curPage.kind === 'view';
  store.cur = pid; saveStore();
  if (changed) { renderPage(pageById(pid)); renderNav(); }

}

/* ---------- search ---------- */
var INDEX = null;
function buildIndex() {
  if (INDEX) return INDEX;
  INDEX = [];
  PAGES.forEach(function (p) {
    var d = p.doc, htmls = d.html_parts ? [d.html_parts.intro, d.html_parts.paper, d.html_parts.key, d.html_parts.score] : [d.html];
    htmls.forEach(function (hh) {
      var dom = new DOMParser().parseFromString('<body>' + hh + '</body>', 'text/html'), cur = { id: p.id, title: pageTitle(p), parts: [] }, secs = [cur];
      Array.prototype.forEach.call(dom.body.children, function (el) {
        if (el.tagName === 'H3' || el.tagName === 'H2') { cur = { id: el.id || p.id, title: el.textContent, parts: [] }; secs.push(cur); }
        cur.parts.push(el.textContent);
      });
      secs.forEach(function (s) { var text = s.parts.join(' ').replace(/\s+/g, ' '); if (text.trim()) INDEX.push({ page: p, id: s.id, title: s.title, text: text, low: (s.title + ' ' + text).toLowerCase() }); });
    });
  });
  return INDEX;
}
function snippet(text, words) {
  var low = text.toLowerCase(), pos = -1;
  words.forEach(function (w) { var i = low.indexOf(w); if (i >= 0 && (pos < 0 || i < pos)) pos = i; });
  var a = Math.max(0, pos - 40), s = text.slice(a, a + 130);
  s = esc(s);
  words.forEach(function (w) { if (w.length > 1) s = s.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>'); });
  return (a > 0 ? '…' : '') + s + '…';
}
function doSearch(q) {
  var box = $('#results');
  q = q.trim().toLowerCase();
  if (!q) { box.hidden = true; box.innerHTML = ''; return; }
  var words = q.split(/\s+/), hits = [];
  buildIndex().forEach(function (s) {
    for (var i = 0; i < words.length; i++) if (s.low.indexOf(words[i]) < 0) return;
    var score = (s.title.toLowerCase().indexOf(words[0]) >= 0 ? 2 : 0);
    hits.push({ s: s, score: score });
  });
  hits.sort(function (a, b) { return b.score - a.score; });
  box.hidden = false;
  if (!hits.length) { box.innerHTML = '<p class="res-none">' + esc(t('noResults')) + '</p>'; return; }
  box.innerHTML = '';
  hits.slice(0, 12).forEach(function (h) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'res';
    b.innerHTML = '<b>' + esc((h.s.page.num ? h.s.page.num + '. ' : '') + pageTitle(h.s.page) + (h.s.title !== pageTitle(h.s.page) ? ' › ' + h.s.title : '')) + '</b><span dir="ltr" lang="en">' + snippet(h.s.text, words) + '</span>';
    b.addEventListener('click', function () { go(h.s.id === h.s.page.id ? h.s.page.id : h.s.id); });
    box.appendChild(b);
  });
}

/* ---- local cache, so changes made offline survive a reload ---- */
function cacheKey() { return 'tracepad.cache.v1.' + (me ? me.id : ''); }

}
function readLocal() { try { return JSON.parse(localStorage.getItem(cacheKey()) || 'null'); } catch (e) { return null; } }

}

function cloudTouch() {

  lastSig = sig;

}
async function flush() {
  if (!sb || !me) return;

    var cur = rowsFromStore(), up = [], del = [];
    Object.keys(cur).forEach(function (k) { if (canon(cur[k]) !== synced[k]) up.push(k); });
    Object.keys(synced).forEach(function (k) { if (!(k in cur)) del.push(k); });
    for (var i = 0; i < up.length; i += 100) {
      var batch = up.slice(i, i + 100).map(function (k) { return { user_id: me.id, key: k, data: cur[k], updated_at: new Date().toISOString() }; });
      var r = await sb.from('progress').upsert(batch, { onConflict: 'user_id,key' });
      if (r.error) throw r.error;
      batch.forEach(function (b) { synced[b.key] = canon(b.data); });
    }
    for (var j = 0; j < del.length; j += 100) {
      var chunk = del.slice(j, j + 100);
      var r2 = await sb.from('progress').delete().eq('user_id', me.id).in('key', chunk);

      chunk.forEach(function (k) { delete synced[k]; });

}

  var rows = [], from = 0;

    var r = await sb.from('progress').select('key,data').eq('user_id', me.id).order('key').range(from, from + 999);
    if (r.error) throw r.error;
    rows = rows.concat(r.data || []);

    from += 1000;

  var server = {}, final = {};

  var local = readLocal();
  if (local && local.rows) {      // changes made on this device that never reached the server
    Object.keys(local.rows).forEach(function (k) { if (canon(local.rows[k]) !== (local.synced || {})[k]) final[k] = local.rows[k]; });
    Object.keys(local.synced || {}).forEach(function (k) { if (!(k in local.rows)) delete final[k]; });
  }
  synced = {}; Object.keys(server).forEach(function (k) { synced[k] = canon(server[k]); });
  storeFromRows(final);
  vfsReset(store.vfs && store.vfs.files, store.vfs && store.vfs.dirs);
  lastSig = canon(rowsFromStore());

}

    const item = classTemplate('class-lesson-review-item');
    $('[data-title]', item).textContent = lessonNum + '. ' + pageTitle(PAGES[lessonNum]);
    $('[data-status]', item).textContent = t(state === 'starting' ? 'readyToStart' : state === 'in_progress' ? 'lessonInProgress' : state === 'submitted' ? 'lessonSubmitted' : state === 'accepted' ? 'lessonAccepted' : 'lessonLocked');
    $('[data-status]', item).classList.add('lesson-status-' + state);
    const acceptButton = $('[data-accept]', item);
    acceptButton.hidden = state !== 'submitted';
    acceptButton.textContent = t('acceptLesson');
    if (state === 'submitted') acceptButton.addEventListener('click', async function () {
      acceptButton.disabled = true;
      acceptButton.textContent = t('acceptingLesson');
      var result = await sb.rpc('accept_lesson', { p_class: classId, p_student: uid, p_lesson: lessonNum });
      if (result.error) { acceptButton.disabled = false; acceptButton.textContent = t('acceptLesson'); alert_(t('errGeneric', { msg: result.error.message })); return; }
      alert_(t('reviewUpdated'));
      renderView();
    });
    reviewList.appendChild(item);
  }
  var weak = rows.filter(function (r) { return r.key.indexOf('miss:') === 0 && TAGS[r.key.slice(5)]; }).sort(function (a, b) { return b.data.n - a.data.n; });
  $('[data-weak-title]', view).textContent = t('weakH');
  $('[data-weak-content]', view).innerHTML = weak.length ? '<ul class="weak">' + weak.map(function (r) { return '<li><span>' + esc(L(TAGS[r.key.slice(5)])) + '</span><b>×' + r.data.n + '</b></li>'; }).join('') + '</ul>' : '<p class="help">' + esc(t('noWeak')) + '</p>';
  var sel = +chSel || 0;
  if (sel >= 1 && sel <= 10) $('[data-chapter-detail]', view).innerHTML = chapterDetail(sel, map);
  main.replaceChildren(view);
  $$('[data-go]', main).forEach(function (b) { b.addEventListener('click', function () { go(b.getAttribute('data-go')); }); });
  $$('tr[data-ch]', main).forEach(function (tr) {
    function open() { go('student/' + classId + '/' + uid + '/' + tr.getAttribute('data-ch')); }
    tr.addEventListener('click', open); tr.addEventListener('keydown', function (e) { if (e.key === 'Enter') open(); });
  });
  if (sel) { var d = $('#chdetail', main); if (d) d.scrollIntoView({ block: 'start' }); }
}
function chapterDetail(n, map) {
  var lab = labDef(n), k = String(n), h = '<section class="sec" id="chdetail"><h3>' + n + '. ' + esc(chTitle(n)) + '</h3>';
  h += '<h4>' + esc(t(n === 10 ? 'partB' : 'predictH')) + '</h4><ul class="alist">' + lab.predictions.map(function (x) {
    var d = map['pred:' + k + ':' + x.id];
    return '<li class="card arow"><pre class="code" dir="ltr">' + esc(x.code) + '</pre>' + (d ? '<div class="note mono">' + esc(t('guessVs')) + ': ' + esc(d.guess) + ' → ' + esc(d.out) + ' <span class="tag ' + (d.right ? 'st-done' : 'bad') + '">' + esc(d.right ? t('yes') : t('no')) + '</span></div>' : '<div class="note">' + esc(t('unanswered')) + '</div>') + '</li>';
  }).join('') + '</ul>';
  if (lab.quizzes.length) h += '<h4>' + esc(t(n === 10 ? 'partA' : 'quizH')) + '</h4><ul class="alist">' + lab.quizzes.map(function (x) {
    var d = map['quiz:' + k + ':' + x.id], opt = function (j) { return esc(L(x.options[j]).replace(/<[^>]+>/g, '')); };
    return '<li class="card arow"><div>' + L(x.q) + '</div>' + (d ? '<div class="note">' + esc(t('picked')) + ': ' + opt(d.choice) + ' <span class="tag ' + (d.choice === x.correct ? 'st-done' : 'bad') + '">' + esc(d.choice === x.correct ? t('yes') : t('no')) + '</span>' + (d.choice === x.correct ? '' : ' · ' + esc(t('correctIs')) + ': ' + opt(x.correct)) + '</div>' : '<div class="note">' + esc(t('unanswered')) + '</div>') + '</li>';
  }).join('') + '</ul>';
  if (lab.exercises.length) h += '<h4>' + esc(t(n === 10 ? 'partC' : 'practiceH')) + '</h4><ul class="alist">' + lab.exercises.map(function (x) {
    var d = map['ex:' + k + ':' + x.id];
    return '<li class="card arow"><div class="agrow"><strong>' + esc(x.title || x.id) + '</strong>' + (d && d.pass ? '<span class="tag st-done">' + esc(t('pass')) + '</span>' : '<span class="tag">' + esc(d ? t('inProgress') : t('notStarted')) + '</span>') + '</div>' +
      (d ? '<div class="note">' + esc(t('hintsUsed')) + ': ' + (d.hints || 0) + (d.peek ? ' · ' + esc(t('peeked')) : '') + '</div>' + (d.code ? '<details class="fold"><summary>' + esc(t('attempts')) + '</summary><pre class="code" dir="ltr">' + esc(d.code) + '</pre></details>' : '') : '') + '</li>';
  }).join('') + '</ul>';
  return h + '</section>';
}

/* ---------- boot ---------- */
function renderCurrent() {
  if (curPage && curPage.kind === 'view') { renderNav(); return renderView(); }
  renderNav(); renderPage(curPage || pageById(store.cur) || PAGES[0]);
}
function renderAll() {
  applyLang(); renderNav(); renderWatch(); paintUser();
  if (!me) return showAuth();
  renderCurrent();
}
function boot() {
  loadDevice();
  applyTheme();
  if (typeof Sk === 'undefined') { var eb = $('#engineError'); eb.hidden = false; eb.textContent = t('engineErr'); }
  else setupEngine();
  initCloud();
  $$('.seg button[data-lang]').forEach(function (b) { b.addEventListener('click', function () { store.lang = b.getAttribute('data-lang'); saveStore(); renderAll(); doSearch($('#q').value); }); });
  $('#themeBtn').addEventListener('click', function () { store.theme = store.theme === 'auto' ? 'light' : store.theme === 'light' ? 'dark' : 'auto'; saveStore(); applyTheme(); });
  $('#signOutBtn').addEventListener('click', cloudSignOut);
  var armed = false, rb = $('#resetBtn');
  rb.addEventListener('click', async function () {
    if (!armed) { armed = true; rb.textContent = t('resetConfirm'); setTimeout(function () { armed = false; rb.textContent = t('reset'); }, 4000); return; }
    armed = false;
    try { await cloudReset(); } catch (e) { alert_(t('errGeneric', { msg: String(e.message || e) })); }
    renderAll();
  });
  var q = $('#q'), tm = 0;
  q.addEventListener('input', function () { clearTimeout(tm); tm = setTimeout(function () { doSearch(q.value); }, 120); });
  q.addEventListener('keydown', function (e) { if (e.key === 'Escape') { q.value = ''; doSearch(''); } });
  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (!a || !me) return;
    var id = decodeURIComponent(a.getAttribute('href').slice(1));
    if (!id) return;
    e.preventDefault(); go(id);
  });
  window.addEventListener('hashchange', function () { if (!me) return; var id = decodeURIComponent(location.hash.slice(1)); if (id) go(id); });
  window.addEventListener('beforeunload', function () { if (me) persistLocal(); });
  applyLang();
  if (!sb) return showAuth();
  sb.auth.getSession().then(function (r) {
    var s = r.data && r.data.session;
    if (!s) return showAuth();
    enterApp(s.user).catch(function (e) { showAuth(t('errGeneric', { msg: String(e && e.message || e) })); });
  });
}
window.TP = { go: go, pages: PAGES, store: store, whoami: function () { return me; } };
boot();
})();

</script>
